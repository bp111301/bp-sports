name: CFB V2 research audit
on:
  push:
    branches: [cfb-v2-research]
    paths:
      - "research/cfb/deep_audit.py"
      - "research/cfb/audit_2026_diagnostic.py"
      - "research/cfb/experiment_margin_v2.py"
      - "research/cfb/validate_margin_v2.py"
      - "research/cfb/market_benchmark_v2.py"
      - "research/cfb/market_incremental_v2.py"
      - "research/cfb/experiment_reliability_adjustments.py"
      - ".github/workflows/cfb_v2_research.yml"
      - "!research/cfb/v2_results/**"
  workflow_dispatch:
concurrency:
  group: cfb-v2-research
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfb-v2-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy scikit-learn
      - name: Download historical development data
        run: python research/cfb/download_matchup_lines.py 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025
      - name: Run margin challenger
        run: python research/cfb/experiment_margin_v2.py
      - name: Meta walk-forward margin validation
        run: python research/cfb/validate_margin_v2.py
      - name: Run external market benchmark
        run: python research/cfb/market_benchmark_v2.py
      - name: Test incremental information beyond market
        run: python research/cfb/market_incremental_v2.py
      - name: Run frozen V1 deep audit
        run: python research/cfb/deep_audit.py
      - name: Test reliability adjustments
        run: python research/cfb/experiment_reliability_adjustments.py
      - name: Audit untouched 2026 diagnostic
        run: python research/cfb/audit_2026_diagnostic.py
      - name: Commit research outputs
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/cfb/v2_results/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update CFB V2 research outputs"
            git pull --rebase origin cfb-v2-research
            for attempt in 1 2 3; do
              git push origin HEAD:cfb-v2-research && break
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi
