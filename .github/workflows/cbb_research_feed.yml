name: Validate CBB prospective research feed
on:
  workflow_dispatch:
  push:
    branches: [cbb-v1-research]
    paths:
      - 'research/cbb/**'
      - '.github/workflows/cbb_research_feed.yml'
permissions:
  contents: write
concurrency:
  group: cbb-research-feed
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbb-v1-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/cbb/requirements.txt
      - name: Verify leakage, capture and grading rules
        run: python -m pytest -q research/cbb/test_develop.py research/cbb/test_holdout.py research/cbb/test_prospective.py
      - uses: actions/cache@v4
        with:
          path: runtime/cbb
          key: cbb-history-2020-2026-v1
      - name: Build research captures without retraining
        run: python research/cbb/prospective.py
      - name: Save CBB research feed
        run: |
          git config user.name 'bp-sports-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/cbb/prospective
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save CBB prospective research captures [skip ci]'
          git pull --rebase origin cbb-v1-research
          git push origin HEAD:cbb-v1-research
