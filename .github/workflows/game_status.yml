name: Refresh game scores and status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/game_status.yml', 'pipeline/build_game_status.py', 'game_status.py']
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: bp-sports-game-status
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt requests pytest
      - name: Check score validation and presentation rules
        run: python -m pytest -q tests/test_game_center.py
      - name: Refresh presentation-only scores
        run: python pipeline/build_game_status.py
      - name: Save score feed only
        run: |
          git config user.name 'bp-sports-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/game_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh presentation-only game scores [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              git push origin HEAD:main && break
              if [ "$attempt" = '3' ]; then exit 1; fi
            done
          fi
