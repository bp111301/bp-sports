name: Refresh game scores and status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/game_status.yml', 'pipeline/build_game_status.py', 'game_status.py', 'live_scores.py', 'game_center_ui.py', 'preview_data.py', 'tests/test_game_center.py', 'tests/test_live_scores.py']
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
concurrency:
  group: bp-sports-game-status
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt requests pytest
      - name: Check score validation and presentation rules
        run: python -m pytest -q tests/test_game_center.py tests/test_live_scores.py
      - name: Save score feed only
        run: |
          git config user.name 'bp-sports-bot'
          git config user.email 'actions@users.noreply.github.com'
          # Rebuild from the latest checkout rather than rebasing a generated JSON file.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python pipeline/build_game_status.py
            git add data/game_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh presentation-only game scores [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Could not save score feed after three attempts' >&2
          exit 1
