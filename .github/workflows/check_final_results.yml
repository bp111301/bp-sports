name: Check confirmed final results
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check_final_results.yml'
      - 'pipeline/check_finals.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh game scores and status']
    types: [completed]
  schedule:
    - cron: '4-59/5 * * * *'
permissions:
  contents: write
jobs:
  grade:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sport: nfl
            branch: main
            group: bp-sports-predictions-refs/heads/main
          - sport: cfb
            branch: main
            group: cfb-production-update
          - sport: nhl
            branch: nhl-v1-research
            group: nhl-confirmed-goalie-experiment
          - sport: nba
            branch: nba-v1-research
            group: nba-prospective-ledger
          - sport: cbb
            branch: cbb-v1-research
            group: cbb-research-feed
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: result-runner
          sparse-checkout: |
            pipeline/check_finals.py
            pipeline/verify_preservation.py
            tests/test_final_checks.py
            .github/workflows/check_final_results.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: result-runner/.github/workflows/check_final_results.yml
      - run: pip install pandas==2.2.3 numpy==2.3.5 requests==2.32.5 scikit-learn==1.8.0 joblib==1.5.3 pytest==8.4.2
      - name: Verify final-only grading rules
        run: python -m pytest -q result-runner/tests/test_final_checks.py
      - name: Grade saved snapshots from confirmed finals
        id: finals
        continue-on-error: true
        run: python result-runner/pipeline/check_finals.py ${{ matrix.sport }}
      - name: Save results without changing predictions or model artifacts
        if: ${{ !cancelled() && (steps.finals.outcome == 'success' || steps.finals.outcome == 'failure') }}
        env:
          SPORT: ${{ matrix.sport }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          git config user.name 'bp-sports-bot'
          git config user.email 'actions@users.noreply.github.com'
          git diff --exit-code -- model/
          if [ "$SPORT" = nfl ]; then health=data/current/result_check.json; else health="data/$SPORT/result_check.json"; fi
          git add "$health"
          status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$health")
          if [ "$status" = success ] || [ "$status" = degraded ]; then
          python result-runner/pipeline/verify_preservation.py
          case "$SPORT" in
            nfl) git add data/ledger/ data/current/result_check.json ;;
            cfb) git add data/cfb/ledger/ data/cfb/v2_shadow/verified_prediction_ledger.csv data/cfb/v2_shadow/summary.json data/cfb/result_check.json ;;
            nhl) git add data/nhl/v2_research/ data/nhl/goalie_experiment/ data/nhl/result_check.json ;;
            nba)
              git diff --exit-code -- data/nba/prospective/predictions.jsonl
              git add data/nba/prospective/results.jsonl data/nba/prospective/dashboard.json data/nba/result_check.json ;;
            cbb) git add data/cbb/prospective/ data/cbb/result_check.json ;;
          esac
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Grade confirmed $SPORT final results [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_BRANCH"
              git push origin "HEAD:$TARGET_BRANCH" && break
              if [ "$attempt" = '3' ]; then exit 1; fi
            done
          fi
      - name: Report incomplete final checks
        if: steps.finals.outcome == 'failure'
        run: exit 1
