name: Update CFB predictions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update_cfb_predictions.yml"
      - "research/cfb/**"
      - "model/cfb/**"
      - "!data/cfb/**"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * 1,8-12 *"
      timezone: "America/Chicago"

concurrency:
  group: cfb-production-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued schedule events can point behind grades already published.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==3.0.6 numpy==2.5.3 scikit-learn==1.9.1 joblib==1.6.0 pytest requests
      - name: Require existing frozen artifacts
        run: |
          test -f model/cfb/v1/frozen_bundle.joblib
          test -f model/cfb/v2/candidate_b_bundle.joblib
      - name: Refresh current CFB sources
        run: |
          python research/cfb/download_matchup_lines.py 2026
          python research/cfb/download_schedule.py 2026
      - name: Validate frozen CFB guardrails
        run: python -m pytest -q tests/test_cfb_research.py tests/test_cfb_settlement.py
      - name: Validate challenger and input-receipt safety
        run: python -m unittest discover -s research/challengers_20261028 -p 'test_safety.py'
      - name: Settle completed V1 snapshots
        run: python research/cfb/settle_predictions.py
      - name: Settle completed Candidate B shadow snapshots
        run: python research/cfb/settle_candidate_b_shadow.py
      - name: Build current frozen CFB V1 slate
        run: python research/cfb/build_live_predictions.py
      - name: Preserve separate CFB input receipts and source coverage
        run: python research/challengers_20261028/capture_cfb_inputs.py
      - name: Build Candidate B prospective shadow slate
        run: python research/cfb/build_candidate_b_shadow.py
      - name: Score prospective Candidate B shadow
        run: python research/cfb/report_candidate_b_shadow.py
      - name: Commit CFB feeds, frozen challenger artifact, and ledgers
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --exit-code -- model/
          python pipeline/verify_preservation.py
          git add data/cfb/
          if git diff --cached --quiet; then
            echo "No CFB data changes"
          else
            git commit -m "Update frozen CFB predictions and Candidate B shadow"
            git pull --rebase origin main
            for attempt in 1 2 3; do
              git push origin HEAD:main && break
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
          fi

