name: Update CFB predictions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update_cfb_predictions.yml"
      - "research/cfb/**"
      - "model/cfb/**"
      - "!data/cfb/**"
  workflow_dispatch:
  schedule:
    - cron: "0 13,14 * 1,8-12 *"

concurrency:
  group: cfb-production-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate scheduled run to 8 AM Central
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          if [ "$HOUR" != "08" ]; then echo "Not 8 AM Central; exiting cleanly."; exit 0; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn joblib pytest
      - name: Download fixed Candidate B training data if bundle is absent
        run: |
          if [ ! -f model/cfb/v2/candidate_b_bundle.joblib ]; then
            python research/cfb/download_matchup_lines.py 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025
          fi
      - name: Refresh current CFB sources
        run: |
          python research/cfb/download_matchup_lines.py 2026
          python research/cfb/download_schedule.py 2026
      - name: Validate frozen CFB guardrails
        run: pytest -q tests/test_cfb_research.py
      - name: Freeze Candidate B artifact if absent
        run: |
          if [ ! -f model/cfb/v2/candidate_b_bundle.joblib ]; then
            python research/cfb/freeze_candidate_b.py
          fi
      - name: Settle completed V1 snapshots
        run: python research/cfb/settle_predictions.py
      - name: Settle completed Candidate B shadow snapshots
        run: python research/cfb/settle_candidate_b_shadow.py
      - name: Build current frozen CFB V1 slate
        run: python research/cfb/build_live_predictions.py
      - name: Build Candidate B prospective shadow slate
        run: python research/cfb/build_candidate_b_shadow.py
      - name: Score prospective Candidate B shadow
        run: python research/cfb/report_candidate_b_shadow.py
      - name: Commit CFB feeds, frozen challenger artifact, and ledgers
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cfb/ model/cfb/v2/
          if git diff --cached --quiet; then
            echo "No CFB data changes"
          else
            git commit -m "Update frozen CFB predictions and Candidate B shadow"
            git pull --rebase origin main
            for attempt in 1 2 3; do
              git push origin HEAD:main && break
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
          fi
