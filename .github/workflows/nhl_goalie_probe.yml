name: NHL goalie source probe
on:
  push:
    branches: [nhl-v1-research]
    paths:
      - ".github/workflows/nhl_goalie_probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nhl-v1-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Probe goalie game schema
        run: python research/nhl/download_goalie_game_stats.py 20242025
      - name: Commit schema
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/nhl/results/goalie_stats_schema.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record NHL goalie game schema"
          git pull --rebase origin nhl-v1-research
          git push origin HEAD:nhl-v1-research
