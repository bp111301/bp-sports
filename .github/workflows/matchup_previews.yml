name: Refresh matchup previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchup_previews.yml'
      - 'pipeline/build_matchup_previews.py'
      - 'preview_data.py'
      - 'matchup_preview_ui.py'
  workflow_dispatch:
  schedule:
    - cron: '32 * * * *'
permissions:
  contents: write
concurrency:
  group: bp-sports-matchup-previews
  cancel-in-progress: false
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt requests
      - name: Verify pregame context and synopsis safeguards
        run: python -m pytest -q tests/test_matchup_previews.py
      - name: Build presentation-only previews
        run: python pipeline/build_matchup_previews.py
      - name: Commit only preview context
        run: |
          git config user.name 'bp-sports-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/matchup_previews.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh presentation-only matchup previews [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            if [ "$attempt" = '3' ]; then exit 1; fi
            sleep $((attempt * 3))
          done
