name: NBA V1 chronological baseline
on:
  push:
    branches: [nba-v1-research]
    paths:
      - 'research/nba/**'
      - '.github/workflows/nba_v1_research.yml'
      - '!research/nba/results/**'
      - '!research/nba/final/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-v1-research
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nba-v1-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 numpy==2.3.5 scikit-learn==1.8.0 pyarrow==23.0.1 requests==2.32.5 pytest==8.4.2
      - name: Verify chronological safety
        run: pytest -q research/nba/test_safety.py research/nba/test_tournament_safety.py
      - name: Download only development seasons
        run: python research/nba/download_data.py
      - name: Run fixed expanding-season baseline
        run: python research/nba/baseline.py
      - name: Run preregistered advanced team-stat tournament
        run: python research/nba/tournament.py
      - name: Save audited research outputs
        run: |
          git config user.name 'bp-sports-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/nba/source/ research/nba/results/
          if ! git diff --cached --quiet; then
            git commit -m 'Save NBA V1 chronological baseline outputs [skip ci]'
            git pull --rebase origin nba-v1-research
            git push origin HEAD:nba-v1-research
          fi
