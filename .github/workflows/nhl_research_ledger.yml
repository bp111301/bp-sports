name: NHL experimental pregame research ledger
on:
  push:
    branches: [nhl-v1-research]
    paths:
      - "research/nhl/prospective/**"
      - "model/nhl/v2_research/spec.json"
      - ".github/workflows/nhl_research_ledger.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"
concurrency:
  group: nhl-experimental-ledger
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nhl-v1-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible research dependencies
        run: |
          if [ -f model/nhl/v2_research/requirements-frozen.txt ]; then
            pip install -r model/nhl/v2_research/requirements-frozen.txt
          else
            pip install pandas numpy scikit-learn scipy joblib requests
          fi
      - name: Verify pregame ledger and model safety
        run: |
          python research/nhl/prospective/test_ledger_safety.py
          python research/nhl/v2/test_model_safety.py
          python research/nhl/v2/test_regulation_safety.py
      - name: Download fixed training history
        run: |
          python research/nhl/download_games.py 20182019 20192020 20202021 20212022 20222023 20232024 20242025 20252026 --out-dir runtime/nhl/prospective/training_games
          python research/nhl/download_team_game_stats.py 20182019 20192020 20202021 20212022 20222023 20232024 20242025 20252026 --out-dir runtime/nhl/prospective/training_team_stats --schema-out runtime/nhl/prospective/training_team_stats/schema.json
      - name: Download current season schedule for pregame capture
        run: python research/nhl/download_games.py 20262027 --out-dir runtime/nhl/prospective/current_games
      - name: Freeze watchlist if new, capture pregame predictions and settle valid rows
        run: python research/nhl/prospective/build_ledger.py
      - name: Commit locked research artifacts and immutable ledger
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model/nhl/v2_research/ data/nhl/v2_research/
          if ! git diff --cached --quiet; then
            git commit -m "Capture NHL experimental pregame research ledger [skip ci]"
            git pull --rebase origin nhl-v1-research
            git push origin HEAD:nhl-v1-research
          fi
