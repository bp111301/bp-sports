name: CFB V1 research baseline

on:
  push:
    branches: [cfb-v1-research]
    paths:
      - "research/cfb/**"
      - ".github/workflows/cfb_v1_research.yml"
      - "!research/cfb/results/**"
  workflow_dispatch:

concurrency:
  group: cfb-v1-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfb-v1-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn pytest
      - name: Download leakage-safe matchup lines
        run: python research/cfb/download_matchup_lines.py 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025
      - name: Run guardrail tests
        run: pytest -q tests/test_cfb_research.py
      - name: Run expanding-window baseline
        run: python research/cfb/backtest_baseline.py --first-test-season 2018
      - name: Run CFB candidate tournament
        run: python research/cfb/experiment_candidates.py
      - name: Run CFB calibration experiment
        run: python research/cfb/experiment_calibration.py
      - name: Run CFB dynamic prior experiment
        run: python research/cfb/experiment_priors.py
      - name: Commit research results
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/cfb/results/
          if git diff --cached --quiet; then
            echo "No research result changes"
          else
            git commit -m "Update CFB V1 research results"
            git pull --rebase origin cfb-v1-research
            git push origin HEAD:cfb-v1-research
          fi
