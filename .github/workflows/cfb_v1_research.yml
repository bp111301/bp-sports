name: CFB V1 research baseline

on:
  push:
    branches: [cfb-v1-research]
    paths:
      - "research/cfb/**"
      - "model/cfb/**"
      - "app.py"
      - ".github/workflows/cfb_v1_research.yml"
      - "!research/cfb/results/**"
      - "!data/cfb/**"
  workflow_dispatch:

concurrency:
  group: cfb-v1-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfb-v1-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn pytest
      - name: Download leakage-safe matchup lines
        run: python research/cfb/download_matchup_lines.py 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026
      - name: Download exact 2026 schedule
        run: python research/cfb/download_schedule.py 2026
      - name: Download game-level QB data
        run: python research/cfb/download_qb_data.py 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025
      - name: Compile dashboard
        run: python -m py_compile app.py
      - name: Run guardrail tests
        run: pytest -q tests/test_cfb_research.py
      - name: Run historical research suite
        run: |
          python research/cfb/backtest_baseline.py --first-test-season 2018
          python research/cfb/experiment_candidates.py
          python research/cfb/experiment_calibration.py
          python research/cfb/experiment_priors.py
          python research/cfb/experiment_qb.py
          python research/cfb/final_development_tournament.py
      - name: Build frozen CFB V1 bundle
        run: python research/cfb/freeze_bundle.py
      - name: Open frozen 2026 diagnostic
        run: python research/cfb/evaluate_frozen_2026.py
      - name: Build first prospective CFB slate
        run: python research/cfb/build_live_predictions.py
      - name: Commit research and frozen prediction outputs
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/cfb/results/ data/cfb/ model/cfb/v1/frozen_bundle.joblib model/cfb/v1/bundle_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update frozen CFB V1 outputs"
            git pull --rebase origin cfb-v1-research
            git push origin HEAD:cfb-v1-research
          fi
