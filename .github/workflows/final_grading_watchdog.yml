name: Keep final grading running
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final_grading_watchdog.yml'
      - 'pipeline/nba_pregame_due.py'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: bp-sports-final-grading-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipeline/nba_pregame_due.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Start overdue grading and NBA pregame checks
        run: |
          dispatch_if_due() {
            local workflow="$1"
            local endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow"
            local latest status started_at
            if latest=$(gh api "$endpoint/runs?branch=main&per_page=1" \
              --jq '.workflow_runs[0] | if . then [.status, .run_started_at // .created_at] | @tsv else "missing" end'); then
              read -r status started_at <<< "$latest"
              if [[ "$status" == missing ]] || {
                [[ "$status" == completed ]] &&
                (( $(date -u +%s) - $(date -u -d "$started_at" +%s) >= 300 ));
              }; then
                echo "Requesting $workflow."
                gh api --method POST "$endpoint/dispatches" -f ref=main ||
                  echo "Dispatch failed for $workflow. The next check will retry." >&2
              fi
            else
              echo "Could not read status for $workflow. The next check will retry." >&2
            fi
          }

          for ((check=0; check<70; check++)); do
            dispatch_if_due check_final_results.yml
            if nba_due=$(python3 pipeline/nba_pregame_due.py) && [[ -n "$nba_due" ]]; then
              echo "NBA injury capture window open for $nba_due."
              dispatch_if_due nba_prospective.yml
            fi
            sleep 300
          done
