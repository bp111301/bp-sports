name: NHL V1 research
on:
  push:
    branches: [nhl-v1-research]
    paths:
      - "research/nhl/**"
      - ".github/workflows/nhl_v1_research.yml"
      - "!research/nhl/results/**"
  workflow_dispatch:
concurrency:
  group: nhl-v1-research
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nhl-v1-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn requests
      - name: Download NHL development seasons
        run: python research/nhl/download_games.py 20182019 20192020 20202021 20212022 20222023 20232024 20242025 20252026
      - name: Download per-game NHL team stats
        run: python research/nhl/download_team_game_stats.py 20182019 20192020 20202021 20212022 20222023 20232024 20242025 20252026
      - name: Download per-game goalie stats
        run: python research/nhl/download_goalie_game_stats.py 20182019 20192020 20202021 20212022 20222023 20232024 20242025 20252026
      - name: Run chronological baseline
        run: python research/nhl/backtest_baseline.py
      - name: Run development tournament
        run: python research/nhl/experiment_baselines.py
      - name: Run advanced team-stats tournament
        run: python research/nhl/experiment_team_stats.py
      - name: Verify goalie leakage safeguards
        run: python research/nhl/test_goalie_safety.py
      - name: Run weighted goalie follow-up
        run: python research/nhl/experiment_goalies_weighted.py
      - name: Run goalie tournament
        run: python research/nhl/experiment_goalies.py
      - name: Commit NHL research outputs
        run: |
          git config user.name "bp-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/nhl/results/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update NHL V1 research results"
            git pull --rebase origin nhl-v1-research
            for attempt in 1 2 3; do
              git push origin HEAD:nhl-v1-research && break
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep $((attempt * 5))
              git pull --rebase origin nhl-v1-research
            done
          fi
